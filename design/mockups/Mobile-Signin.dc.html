<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F0E6}
a{color:#A34A28}a:hover{color:#2B2420}
.adire{background-color:#2E3A59;background-image:radial-gradient(circle,#DDE2EC 2px,transparent 2.5px);background-size:14px 14px;background-position:7px 7px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F0E6; color: #2B2420; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; background: #2E3A59; color: #F6F0E6;">
    <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background: #F6F0E6; color: #2E3A59; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 14px; font-weight: 600;">L&amp;L</div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <span style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 24px;">Loom &amp; Lane</span>
      <span style="font-size: 12px; line-height: 16px; color: #DDE2EC;">AI assistant</span>
    </div>
    <button aria-label="Close chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F6F0E6; display: flex; align-items: center; justify-content: center; border-radius: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <div class="adire" aria-hidden="true" style="height: 14px; flex-shrink: 0;"></div>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 32px 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 500;">Sign in to chat</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #6B5E52;">So we can keep your conversations together and pick up where you left off.</p>
    </div>

    <div role="tablist" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; background: #E7DCCB; border-radius: 999px;">
      <button role="tab" aria-selected="true" type="button" style="height: 40px; border: 0; border-radius: 999px; background: #FFFBF5; color: #2B2420; font-family: inherit; font-size: 13px; font-weight: 600;">Sign in</button>
      <button role="tab" aria-selected="false" type="button" style="height: 40px; border: 0; border-radius: 999px; background: transparent; color: #2B2420; font-family: inherit; font-size: 13px; font-weight: 600;">Create account</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="email" style="font-size: 13px; font-weight: 600;">Email</label>
      <input id="email" type="email" value="adaeze@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8C7D6E; border-radius: 4px; background: #FFFBF5; color: #2B2420; font-family: inherit; font-size: 15px;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="password" style="font-size: 13px; font-weight: 600;">Password</label>
      <input id="password" type="password" value="password123" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #8C7D6E; border-radius: 4px; background: #FFFBF5; color: #2B2420; font-family: inherit; font-size: 15px;">
      <span style="font-size: 12px; line-height: 16px; color: #6B5E52;">At least 8 characters.</span>
    </div>

    <button type="submit" style="height: 48px; border: 0; border-radius: 4px; background: #2E3A59; color: #F6F0E6; font-family: inherit; font-size: 15px; font-weight: 600;">Sign in and start chatting</button>

    <div style="display: flex; align-items: center; gap: 12px;">
      <span aria-hidden="true" style="flex: 1; border-top: 1px dashed #E7DCCB;"></span>
      <span style="font-size: 12px; font-weight: 500; color: #6B5E52;">Prefer a person?</span>
      <span aria-hidden="true" style="flex: 1; border-top: 1px dashed #E7DCCB;"></span>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #6B5E52; text-align: center;">Email <a href="#">support@loomandlane.example</a> or WhatsApp <a href="#">+234 800 000 0000</a>, Monday to Saturday, 9am to 6pm.</p>
  </form>
</div>
</x-dc>
